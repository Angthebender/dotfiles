[general]

framerate = 60
bars = 10

autosens = 1
sensitivity = 100

lower_cutoff_freq = 50
higher_cutoff_freq = 12000


[input]

method = pipewire
source = auto


[output]

method = raw
raw_target = /dev/stdout

data_format = ascii
ascii_max_range = 7

bar_delimiter = 59
frame_delimiter = 10

channels = stereo


[smoothing]

noise_reduction = 55
monstercat = 1
waves = 0

bar_width =1
ar_spacing =30
